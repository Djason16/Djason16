# Draws the contribution snake of the profile README (snake-dark.svg and snake-light.svg on the branch output),
# in the colours of djason-chery.dev (ink and mint), every day at 5 am
# and on demand (Actions tab > "Contribution snake" > Run workflow)
name: Contribution snake

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#7ee6a8&color_dots=#1a1f24,#1d3a2c,#2a6348,#479e72,#6fd29b
            dist/snake-light.svg?color_snake=#1f8a5a&color_dots=#ebedf0,#c9efd8,#93dbb1,#4fbf82,#2a9a64

      # On their own branch: the history of master keeps only the changes of the README
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
