# Builds the GitHub stats images of the profile README (profile-summary-card-output/ of the branch summary-cards),
# every day at 4 am
# and on demand (Actions tab > "Profile summary cards" > Run workflow)
name: Profile summary cards

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The branch of the images: the action commits on the branch it starts from
      - uses: actions/checkout@v4
        with:
          ref: summary-cards
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          # On their own branch: the history of master keeps only the changes of the README
          BRANCH_NAME: summary-cards
